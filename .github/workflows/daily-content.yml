name: Daily Content

on:
  schedule:
    # 03:00 UTC ≈ 08:30 IST
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      article_count:
        description: "Number of articles to generate"
        required: false
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate 2 articles with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          ARTICLE_COUNT: ${{ github.event.inputs.article_count || '2' }}
        run: python scripts/generate_daily_content.py

      - name: Commit and push new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Content Resources/images || true
          if git diff --staged --quiet; then
            echo "No new content to commit."
            exit 0
          fi
          git commit -m "Add daily AI-generated articles ($(date -u +%Y-%m-%d))"
          git push
